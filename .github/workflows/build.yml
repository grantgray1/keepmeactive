name: CI

# Proves every push still compiles. Publishing is release.yml's job, triggered by a tag.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android step: the Ubuntu runner image already ships the Android SDK with
      # ANDROID_HOME set and the licences accepted. Installing it again was both redundant
      # and the thing that broke the first builds.
      - name: Check the Android SDK is present
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::No Android SDK on this runner image. Add a setup step."
            exit 1
          fi
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(no platforms yet; Gradle will fetch one)"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload for testing
        uses: actions/upload-artifact@v7
        with:
          name: keep-me-active-debug
          path: app/build/outputs/apk/debug/app-debug.apk
