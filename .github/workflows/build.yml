name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk keep-me-active.apk

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: keep-me-active-apk
          path: keep-me-active.apk

      # Also publishes a release so the phone can download the APK from a direct link,
      # rather than unzipping a workflow artifact in a mobile browser.
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Keep Me Active (latest build)
          body: Sideload this APK. Settings > Apps > Special access > Install unknown apps.
          files: keep-me-active.apk
