name: Release

# Cut a release by pushing a tag:  git tag v1.0.0 && git push origin v1.0.0
# The APK is published under a fixed filename so the download page can link to
# .../releases/latest/download/KeepMeActive.apk forever.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        id: version
        run: |
          RAW="${{ github.event.inputs.version }}"
          if [ -z "$RAW" ]; then RAW="${GITHUB_REF_NAME#v}"; fi
          if ! echo "$RAW" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must look like 1.2.3, got '$RAW'" >&2
            exit 1
          fi
          MAJOR=$(echo "$RAW" | cut -d. -f1)
          MINOR=$(echo "$RAW" | cut -d. -f2)
          PATCH=$(echo "$RAW" | cut -d. -f3)
          # Monotonic so Android always sees a newer build as newer.
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=$RAW" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $RAW (versionCode $CODE)"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK; installing it again was what broke
      # the early builds.
      - name: Check the Android SDK is present
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::No Android SDK on this runner image. Add a setup step."
            exit 1
          fi

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      # Refuses to publish rather than falling back to the debug key. An unsigned release
      # looks fine until the first update, which Android then rejects with a bare
      # "App not installed" and no way out but uninstalling. Better to fail here, loudly,
      # having published nothing.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ]   && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]         && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]      && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secret(s):$missing - nothing has been published."
            echo "::error::Add them under Settings > Secrets and variables > Actions."
            echo "::error::See RELEASING.md for how to generate the keystore."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          if [ ! -s "$RUNNER_TEMP/release.keystore" ]; then
            echo "::error::KEYSTORE_BASE64 did not decode to a file. Re-copy it whole."
            exit 1
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "Signing with the release key."

      - name: Build release APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Record which certificate signed it
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk || true
          else
            echo "apksigner not found; skipping the fingerprint record."
          fi

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk KeepMeActive.apk
          cp KeepMeActive.apk "KeepMeActive-v${{ steps.version.outputs.name }}.apk"
          ls -lh KeepMeActive*.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Keep Me Active ${{ steps.version.outputs.name }}
          files: |
            KeepMeActive.apk
            KeepMeActive-v${{ steps.version.outputs.name }}.apk
          body: |
            ## Install

            Download **KeepMeActive.apk** below and tap it on your Android phone.

            Android will block the first install: allow **Install unknown apps** for whichever
            app you downloaded it with, then tap the file again. Play Protect will call it
            unrecognised, as it does for every app not from the Play Store.

            Full setup instructions: https://grantgray1.github.io/keepmeactive/

            ## iPhone

            iOS gives apps no way to send an SMS without a human tap, so there is no iPhone
            build. Use the Shortcuts automation instead:
            https://github.com/grantgray1/keepmeactive/blob/main/IOS-SHORTCUT.md
